<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI课堂反思助手</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body.dark {
      background: #0f172a;
      color: white;
    }
    body.light {
      background: #f5f7fa;
      color: #111827;
    }
    .glass-dark {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .glass-light {
      background: white;
      border: 1px solid #e5e7eb;
    }
  </style>
</head>

<body class="dark min-h-screen transition-all duration-300">

<div class="max-w-7xl mx-auto p-6">

  <!-- 顶部 -->
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-4xl font-bold">AI课堂反思助手</h1>
      <p class="opacity-70">上传课堂实录，自动生成教学分析报告</p>
    </div>

    <button id="themeToggle"
      class="px-4 py-2 rounded-xl bg-gray-800 text-white text-sm">
      切换模式
    </button>
  </div>

  <!-- 主体 -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- 左侧输入 -->
    <div id="leftCard" class="rounded-3xl p-6 shadow-xl">
      <h2 class="text-2xl font-bold mb-4">课堂实录</h2>

      <textarea
        id="inputText"
        rows="16"
        class="w-full p-4 rounded-xl border outline-none"
        placeholder="粘贴课堂实录..."
      ></textarea>

      <button
        id="analyzeBtn"
        class="w-full mt-6 py-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-lg font-semibold transition-all"
      >
        开始分析
      </button>
    </div>

    <!-- 右侧输出 -->
    <div id="rightCard" class="rounded-3xl p-6 shadow-xl relative">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">分析结果</h2>

        <div class="flex gap-3">
          <button id="copyBtn"
            class="px-4 py-2 rounded-lg bg-gray-700 text-white text-sm">
            复制
          </button>
          <span id="status" class="text-sm opacity-70">等待分析</span>
        </div>
      </div>

      <div id="result"
        class="prose max-w-none overflow-y-auto h-[500px]">
        暂无结果
      </div>
    </div>

  </div>
</div>

<script>
/* =========================
   🌗 黑白模式切换
========================= */

const themeToggle = document.getElementById("themeToggle");

function applyTheme(mode) {
  document.body.className = mode + " min-h-screen transition-all duration-300";

  const left = document.getElementById("leftCard");
  const right = document.getElementById("rightCard");

  if (mode === "dark") {
    left.className = "glass-dark rounded-3xl p-6 shadow-xl";
    right.className = "glass-dark rounded-3xl p-6 shadow-xl relative";
    themeToggle.className = "px-4 py-2 rounded-xl bg-gray-800 text-white text-sm";
  } else {
    left.className = "glass-light rounded-3xl p-6 shadow-xl";
    right.className = "glass-light rounded-3xl p-6 shadow-xl relative";
    themeToggle.className = "px-4 py-2 rounded-xl bg-gray-200 text-black text-sm";
  }
}

let currentTheme = localStorage.getItem("theme") || "dark";
applyTheme(currentTheme);

themeToggle.addEventListener("click", () => {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  localStorage.setItem("theme", currentTheme);
  applyTheme(currentTheme);
});

/* =========================
   📤 调用后端
========================= */

const analyzeBtn = document.getElementById("analyzeBtn");

analyzeBtn.addEventListener("click", async () => {

  const text = document.getElementById("inputText").value;
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!text.trim()) {
    alert("请输入课堂实录文本");
    return;
  }

  status.innerText = "分析中...";
  result.innerHTML = "";

  const resp = await fetch("/api/analyze", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  const data = await resp.json();

  const markdown = data.result || "无返回结果";

  // ✅ Markdown 渲染
  result.innerHTML = marked.parse(markdown);

  status.innerText = "分析完成";
});

/* =========================
   📋 一键复制
========================= */

document.getElementById("copyBtn").addEventListener("click", async () => {

  const text = document.getElementById("result").innerText;

  await navigator.clipboard.writeText(text);

  const btn = document.getElementById("copyBtn");
  btn.innerText = "已复制 ✅";

  setTimeout(() => {
    btn.innerText = "复制";
  }, 1500);
});

</script>

</body>
</html>
