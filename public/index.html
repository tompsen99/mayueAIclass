<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI课堂反思助手</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
    }
    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    textarea {
      resize: none;
    }
  </style>
</head>

<body class="min-h-screen p-6">

  <div class="max-w-7xl mx-auto">

    <div class="mb-8">
      <h1 class="text-4xl font-bold mb-2">AI课堂反思助手</h1>
      <p class="text-slate-300">上传课堂实录，自动生成教学分析报告</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- 左侧 -->
      <div class="glass rounded-3xl p-6">

        <h2 class="text-2xl font-bold mb-6">输入内容</h2>

        <label class="block mb-2 font-semibold">课堂实录文本</label>
        <textarea
          id="inputText"
          rows="14"
          class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700"
          placeholder="请粘贴课堂实录文本..."
        ></textarea>

        <button
          id="analyzeBtn"
          class="w-full mt-6 bg-blue-600 hover:bg-blue-700 transition-all p-4 rounded-2xl text-xl font-bold"
        >
          开始分析
        </button>

      </div>

      <!-- 右侧 -->
      <div class="glass rounded-3xl p-6">

        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl font-bold">分析结果</h2>
          <div id="status" class="text-sm text-slate-400">等待分析</div>
        </div>

        <pre
          id="result"
          class="whitespace-pre-wrap leading-7 text-slate-200"
        >暂无结果</pre>

      </div>

    </div>

  </div>

<script>
const analyzeBtn = document.getElementById("analyzeBtn");

analyzeBtn.addEventListener("click", async () => {
  const text = document.getElementById("inputText").value;
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!text.trim()) {
    alert("请先输入课堂实录文本");
    return;
  }

  status.innerText = "分析中...";
  result.innerText = "";

  const resp = await fetch("/api/analyze", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  const data = await resp.json();

  result.innerText = data.result || "无返回结果";
  status.innerText = "分析完成";
});
</script>

</body>
</html>
