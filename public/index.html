<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI课堂反思助手</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>

  <style>
    body.dark { background:#0f172a; color:white; }
    body.light { background:#f5f7fa; color:#111827; }

    .glass-dark {
      background: rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
    }

    .glass-light {
      background:white;
      border:1px solid #e5e7eb;
    }
  </style>
</head>

<body class="dark min-h-screen transition-all duration-300">

<div class="max-w-7xl mx-auto p-6">

  <!-- 顶部 -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">AI课堂反思助手</h1>
    <button id="themeToggle" class="px-4 py-2 rounded-xl bg-gray-800 text-white text-sm">
      切换模式
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- ✅ 历史记录 -->
    <div id="historyCard" class="glass-dark rounded-3xl p-4 h-[600px] overflow-y-auto">
      <h2 class="text-lg font-bold mb-4">历史记录</h2>
      <div id="historyList" class="space-y-2 text-sm"></div>
    </div>

    <!-- ✅ 输入 -->
    <div id="leftCard" class="glass-dark rounded-3xl p-6">
      <h2 class="text-xl font-bold mb-4">课堂实录</h2>

      <textarea id="inputText"
        rows="12"
        class="w-full p-4 rounded-xl border bg-transparent"
        placeholder="粘贴课堂实录..."></textarea>

      <button id="analyzeBtn"
        class="w-full mt-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white">
        开始分析
      </button>
    </div>

    <!-- ✅ 输出 -->
    <div id="rightCard" class="glass-dark rounded-3xl p-6 relative">
      <div class="flex justify-between mb-4">
        <h2 class="text-xl font-bold">分析结果</h2>
        <div class="flex gap-2">
          <button id="copyBtn" class="px-3 py-1 bg-gray-700 text-white rounded-lg text-sm">复制</button>
          <button id="pdfBtn" class="px-3 py-1 bg-green-600 text-white rounded-lg text-sm">导出PDF</button>
        </div>
      </div>

      <div id="result" class="prose max-w-none h-[500px] overflow-y-auto">
        暂无结果
      </div>
    </div>

  </div>
</div>

<script>

/* ======================
   🌗 主题切换
====================== */
const themeToggle = document.getElementById("themeToggle");

function applyTheme(mode){
  document.body.className = mode + " min-h-screen transition-all duration-300";

  const cards = ["historyCard","leftCard","rightCard"];

  cards.forEach(id=>{
    const el = document.getElementById(id);
    el.className = (mode==="dark"?"glass-dark":"glass-light") + " rounded-3xl p-6";
  });
}

let currentTheme = localStorage.getItem("theme") || "dark";
applyTheme(currentTheme);

themeToggle.onclick = ()=>{
  currentTheme = currentTheme==="dark"?"light":"dark";
  localStorage.setItem("theme",currentTheme);
  applyTheme(currentTheme);
};

/* ======================
   📦 本地历史记录
====================== */

function loadHistory(){
  const history = JSON.parse(localStorage.getItem("analysisHistory") || "[]");
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  history.forEach((item,index)=>{
    const div = document.createElement("div");
    div.className="p-2 bg-gray-700 rounded cursor-pointer";
    div.innerText=item.time;
    div.onclick=()=>{
      document.getElementById("inputText").value=item.text;
      document.getElementById("result").innerHTML=item.result;
    };
    list.appendChild(div);
  });
}

function saveHistory(text,result){
  const history = JSON.parse(localStorage.getItem("analysisHistory")||"[]");
  history.unshift({
    time:new Date().toLocaleString(),
    text,
    result
  });
  localStorage.setItem("analysisHistory",JSON.stringify(history.slice(0,20)));
  loadHistory();
}

loadHistory();

/* ======================
   📤 调用API
====================== */

document.getElementById("analyzeBtn").onclick=async()=>{
  const text=document.getElementById("inputText").value;
  const resultDiv=document.getElementById("result");

  if(!text.trim()){
    alert("请输入文本");
    return;
  }

  resultDiv.innerHTML="分析中...";

  const resp=await fetch("/api/analyze",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({text})
  });

  const data=await resp.json();
  const html=marked.parse(data.result||"无结果");

  resultDiv.innerHTML=html;

  saveHistory(text,html);
};

/* ======================
   📋 复制
====================== */
document.getElementById("copyBtn").onclick=()=>{
  navigator.clipboard.writeText(document.getElementById("result").innerText);
};

/* ======================
   📄 导出PDF
====================== */
document.getElementById("pdfBtn").onclick=()=>{
  const element=document.getElementById("result");

  html2pdf().set({
    margin:10,
    filename:"课堂分析报告.pdf",
    html2canvas:{scale:2},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
  }).from(element).save();
};

</script>
</body>
</html>
